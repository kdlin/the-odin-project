<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sign-up-form</title>
  <link rel="stylesheet" href="styles.css"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo">
        <div class="logo-bg">
          <img src="logo.png" alt="logo">
          <span>LinMusic</span>
        </div>
      </div>
    </div>
    
    <div class="content">
      <div class="header">
        <h1>Get ready to reach fretboard mastery</h1>
      </div> 
      <div class="form">
        <form action="/contact" method="POST">
          <div class="field">
            <label for="first_name">First Name</label> 
            <input type="text" id="first_name" name="user_first" required>
          </div>

          <div class="field">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="user_last" required>
          </div>

            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            

            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required minlength="8">
            </div>

            <div class="field">
              <label for="confirm_password">Confirm Password</label>
              <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
          <button type="submit">Create Account</button>
          <p>Already have an account? <a href="#">Log in</a></p> 

        </form>
      </div>
    </div>

  </div>
</body>
</html>
