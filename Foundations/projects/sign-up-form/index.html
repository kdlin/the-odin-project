<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sign-up-form</title>
  <link rel="stylesheet" href="styles.css"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="sidebar">
    </div>
    
    <div class="content">
      <div class="header">
        <h1>Get ready to reach fretboard mastery</h1>
      </div> 
      <div class="form">
        <form action="/contact" method="POST">
          <label for="first_name">First Name</label> 
          <input type="text" id="name" name="user_first" required>

          <label for="last_name">Last Name</label>
          <input type="text" id="name" name="user_last" required="required">
          
        </form>
      </div>
    </div>

  </div>
</body>
</html>
