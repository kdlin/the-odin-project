<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jax Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="brand">
        <h1><img src="img.png" alt="dashboard-logo">Dashboard</h1>
      </div>
      <nav aria-label="page" class="page">
        <ul> 
          <li><a href="#">Home</a></li>
          <li><a href="#">Profile</a></li>
          <li><a href="#">Messages</a></li>
          <li><a href="#">History</a></li>
          <li><a href="#">Tasks</a></li>
          <li><a href="#">Communities</a></li>
        </ul>
      </nav>
      <nav aria-label="utilities" class="utilities">
        <ul>
          <li><a href="#">Settings</a></li>
          <li><a href="#">Support</a></li>
          <li><a href="#">Privacy</a></li>
        </ul>
      </nav>
    </div>
    <header>
      <div class="top-bar">
        <div class="search">
          <img src="" alt="search-icon">
          <input type="search" aria-label="Search" placeholder="Search">
        </div>
        <div class="account-group">
          <img src="" alt="noti-icon">
          <img src="" alt="profile-icon">
          <a href="#">Kendrick Lin</a>
        </div>
      </div>
      <div class="welcome-bar">
        <div class="greeting">
          <img src="" alt="Users profile picture">
          <div class="stacked-welcome">
            <p class="eyebrow">Hi there,</p>
            <p class="username">Kendrick Lin (@kdlin)</p>
          </div>
        </div>
        <div class="actions">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
    </header>
    <main>
      <div class="projects">
        <h2>Your Projects</h2>
        <div class="cards">
          <div class="project-card">
            <div class="card-text">
              <h3>Super Cool Project</h3>
              <p>add content here</p>
            </div>
            <div class="card-actions">
              <button><img src="" alt="Favorites"></button>
              <button><img src="" alt="add-to-view"></button>
              <button><img src="" alt="share"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="announcements">
        <h2>Announcements</h2>
      </div>
      <div class="trending">
        <h2>Trending</h2>
      </div>
    </main>
  </div>
</body>
</html>
