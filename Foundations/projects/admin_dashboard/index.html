<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jax Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="brand">
        <img src="img.png" alt="Dashboard Logo">Dashboard
      </div>
      <nav aria-label="page" class="page">
        <ul> 
          <li><a href="#">Home</a></li>
          <li><a href="#">Profile</a></li>
          <li><a href="#">Messages</a></li>
          <li><a href="#">History</a></li>
          <li><a href="#">Tasks</a></li>
          <li><a href="#">Communities</a></li>
        </ul>
      </nav>
      <nav aria-label="utilities" class="utilities">
        <ul>
          <li><a href="#">Settings</a></li>
          <li><a href="#">Support</a></li>
          <li><a href="#">Privacy</a></li>
        </ul>
      </nav>
    </div>
    <header>
      <div class="top-bar">
        <div class="search">
          <img src="" alt="search-icon">
          <input type="text">
        </div>
        <div class="account-group">
          <img src="" alt="noti-icon">
          <img src="" alt="profile-icon">
          <a href="">Kendrick Lin</a>
        </div>
      </div>
      <div class="welcome-bar">
        <div class="greeting">Welcome Kendrick</div>
        <div class="actions"></div>
      </div>
    </header>
    <main>
      <div class="projects">Projects Section</div>
      <div class="announcements">Announcements</div>
      <div class="trending">Trending</div>
    </main>
  </div>
</body>
</html>
